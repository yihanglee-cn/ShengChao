name: ShengChao
options:
  bundleIdPrefix: com.dan
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: YES
    INFOPLIST_FILE: Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.dan.liquidglassplayer
    ENABLE_HARDENED_RUNTIME: NO
    ONLY_ACTIVE_ARCH: YES

targets:
  LiquidGlassPlayer:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: LiquidGlassPlayer
        PRODUCT_MODULE_NAME: LiquidGlassPlayer
